# XcodeGen project specification. The .xcodeproj is generated from this file:
#   make generate   (or: xcodegen generate)
# Keep this file as the source of truth; do not hand-edit the generated project.
name: ReportingBuilder
options:
  bundleIdPrefix: com.tonywen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ReportCore:
    path: Packages/ReportCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ReportingBuilder:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ReportCore
        product: ReportCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reporting Builder
        CFBundleName: Reporting Builder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Tony Wen"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        BuildFlavor: $(CONFIGURATION)
        FeatureFlags:
          VisionAssist: $(FEATURE_VISION_ASSIST)
          SampleContent: $(FEATURE_SAMPLE_CONTENT)
          AppIntents: $(FEATURE_APP_INTENTS)
          WritingAssistance: $(FEATURE_WRITING_ASSISTANCE)
    entitlements:
      path: App/ReportingBuilder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Outgoing connections, used only by opt-in writing assistance (ADR 0011).
        com.apple.security.network.client: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_NAME: ReportingBuilder
        PRODUCT_BUNDLE_IDENTIFIER: com.tonywen.reportingbuilder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - name: ReportingBuilderTests
        - name: ReportingBuilderUITests
      gatherCoverageData: true
      coverageTargets:
        - ReportingBuilder
      commandLineArguments:
        "-uiTesting": false

  ReportingBuilderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ReportingBuilder
      - package: ReportCore
        product: ReportCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonywen.reportingbuilder.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

  ReportingBuilderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/AppUITests
    dependencies:
      - target: ReportingBuilder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonywen.reportingbuilder.uitests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReportingBuilder
