name: Release

# Builds a downloadable app for every version tag (v1.2.3) and attaches it to a
# GitHub Release. Run it by hand from the Actions tab to get a build artifact
# without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test before packaging
        run: |
          (cd Packages/ReportCore && swift test)
          xcodebuild -project ReportingBuilder.xcodeproj -scheme ReportingBuilder \
            -destination 'platform=macOS' -configuration Debug test \
            -only-testing:ReportingBuilderTests CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - name: Build Release
        run: |
          xcodebuild -project ReportingBuilder.xcodeproj -scheme ReportingBuilder \
            -destination 'platform=macOS' -configuration Release \
            -derivedDataPath build/DerivedData build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      # With a Developer ID certificate and notary credentials stored as secrets,
      # this is where signing and `xcrun notarytool submit --wait` go. The POC
      # ships ad-hoc signed; see docs/DEPLOYMENT.md.
      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          APP="build/DerivedData/Build/Products/Release/ReportingBuilder.app"
          ZIP="ReportingBuilder-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReportingBuilder
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
