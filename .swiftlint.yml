# SwiftLint configuration. Run `make lint`.
included:
  - App
  - Packages/ReportCore/Sources
  - Packages/ReportCore/Tests
  - Tests
excluded:
  - .build
  - DerivedData
  - ReportingBuilder.xcodeproj
  - Packages/ReportCore/.build

disabled_rules:
  - todo
  - nesting
  # Import order is owned by SwiftFormat (testable imports last).
  - sorted_imports

opt_in_rules:
  - closure_spacing
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - implicit_return
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 700

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded: [x, y, w, h, id, up, dy]

large_tuple:
  warning: 3
  error: 4

# Match SwiftFormat's `--commas always`.
trailing_comma:
  mandatory_comma: true
